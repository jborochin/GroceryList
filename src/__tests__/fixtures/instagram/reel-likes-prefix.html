Ingredients:
-1 cup datalini pasta 
-2 cup unsalted chicken broth/stock 
-1/4-1/2 cup Parmesan cheese ( freshly grated preferred)
-splash of heavy cream 
-salt ( to taste)
-fresh ground peppercorn (to taste) 
-2-3 cloves of garlic 

Directions:
1. In a hot pan, cook the minced garlic in oil until fragrant, then add the pasta. Toast for a few minutes, then cover with chicken broth and cook on medium heat until the pasta is cooked. (Make sure you cover the pasta with a lid)
2. Once the pasta is cooked, add the heavy cream and cheese and mix until melted. 
3. Add salt and pepper to taste and enjoy!!
