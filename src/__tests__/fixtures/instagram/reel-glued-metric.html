.
Ingredients.
.
300g pasta (uncooked weight) 
500g chicken, diced 
1tbs smoked paprika 
1/2tbs oregano 
1/2tbs garlic granules
1 onion, finely diced 
2 peppers, finely diced 
2tsp garlic pur&#xe9;e (or 2 cloves) 
1tbs tomato pur&#xe9;e 
4tbs bbq sauce 
300ml chicken stock- I used &#064;knorruk 
120g cheese- I used a mix of cheddar and mozzarella. 
Garnish with bbq sauce, chilli flakes and parsley.
.
Method. 
.
Pop your pasta onto boil with plenty of salt. Meanwhile fry off the chicken with the seasonings until browned, then add in the onions and peppers and cook until soft. Once soft add in the garlic and cook for 30 seconds. Then add in the tomato pur&#xe9;e and bbq sauce and cook for another minute or so. Add in the chicken stock and cook until it&#x2019;s reduced to form a thick sauce. add in the cooked pasta and a little pasta water. Sprinkle with cheese and pop a lid on or put under the grill until golden and bubbling. Garnish. Serve and enjoy. 
.
.
